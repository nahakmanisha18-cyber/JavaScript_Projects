<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Digital Neon Clock</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="clock-container">
            <div class="clock">

                <div class="ampm" id="ampm">AM</div>

                <div class="time">
                    <span id="hours">00</span>
                    <span class="colon">:</span>
                    <span id="minutes">00</span>
                    <span class="colon">:</span>
                    <span id="seconds">00</span>
                </div>

                <div class="days">
                    <span id="0">SUN</span>
                    <span id="1">MON</span>
                    <span id="2">TUE</span>
                    <span id="3">WED</span>
                    <span id="4">THU</span>
                    <span id="5">FRI</span>
                    <span id="6">SAT</span>
                </div>

            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
