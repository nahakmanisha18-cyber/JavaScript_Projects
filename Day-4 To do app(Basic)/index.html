<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do App</title>
        <link rel="stylesheet" href="style.css" />
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>

    <body>

        <div class="back-img">
            <img src="image.jpeg" alt="">
            <h2>ToDo</h2>
            <!-- <i class="bi bi-moon-fill"></i> -->
            <i class="bi bi-sun-fill theme-toggle" id="theme-toggle"></i>
        </div>

        <div class="container">

            <h1> My Tasks</h1>
            <p class="subtitle">Stay on top of what matters</p>


            <div class="input-row">
                <input type="text" id="task-input" placeholder="Add a new task..." maxlength="120" />
                <button id="add-btn">+ Add Task</button>
            </div>


            <div class="stats">
                <div class="stat">
                    <span class="num" id="stat-total">0</span>
                    <span class="lbl">Total</span>
                </div>
                <div class="stat">
                    <span class="num purple" id="stat-pending">0</span>
                    <span class="lbl">Pending</span>
                </div>
                <div class="stat">
                    <span class="num green" id="stat-done">0</span>
                    <span class="lbl">Done</span>
                </div>
            </div>


            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="done">Done</button>
            </div>


            <div class="task-list" id="task-list"></div>


            <div class="footer-row" id="footer-row"></div>

        </div>

        <script src="script.js"></script>
    </body>

</html>
