<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Advanced To-Do App</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>

    <body>

        <div class="back-img">
            <img src="https://t4.ftcdn.net/jpg/00/78/08/93/360_F_78089331_Gg57V2EkQ566wPisVY08N2PYNs319UhF.jpg" alt="">
            <h2>ToDo</h2>
            <!-- <i class="bi bi-moon-fill"></i> -->
            <i class="bi bi-sun-fill theme-toggle" id="theme-toggle"></i>
        </div>

        <div class="container">

            <!-- Header -->
            <div class="header">
                <div>
                    <h1>Advanced To-Do</h1>
                    <p class="subtitle" id="date-display"></p>
                </div>
                <button class="clear-all-btn" id="clear-all-btn" title="Clear all tasks">Clear All</button>
            </div>

            <!-- Input Row -->
            <div class="input-row">
                <input type="text" id="task-input" placeholder="Add a new task..." maxlength="120" />
                <div class="select-wrapper">
                    <select id="priority-select">
                        <option value="low">🟢 Low</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="high">🔴 High</option>
                    </select>
                    <i class="fa-solid fa-angle-down"></i>
                </div>
                <button id="add-btn">+ Add</button>
            </div>

            <!-- Search -->
            <div class="search-row">
                <span class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Search tasks..." />
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <span class="num" id="stat-total">0</span>
                    <span class="lbl">Total</span>
                </div>
                <div class="stat">
                    <span class="num blue" id="stat-pending">0</span>
                    <span class="lbl">Pending</span>
                </div>
                <div class="stat">
                    <span class="num green" id="stat-done">0</span>
                    <span class="lbl">Done</span>
                </div>
                <div class="stat">
                    <span class="num orange" id="stat-high">0</span>
                    <span class="lbl">High Priority</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-wrap">
                <div class="progress-info">
                    <span>Progress</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-row">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="done">Done</button>
                    <button class="filter-btn" data-filter="high">🔴 High</button>
                </div>
                <div class="sort-wrapper">
                    <select id="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="priority">By Priority</option>
                        <option value="alpha">A → Z</option>
                    </select>
                    <i class="fa-solid fa-angle-down"></i>
                </div>
            </div>

            <!-- Task List -->
            <div class="task-list" id="task-list"></div>

            <!-- Footer -->
            <div class="footer-row" id="footer-row"></div>

        </div>

        <!-- Edit Modal -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <h2>✏️ Edit Task</h2>
                <input type="text" id="edit-input" placeholder="Edit task..." maxlength="120" />
                <select id="edit-priority">
                    <option value="low">🟢 Low Priority</option>
                    <option value="medium">🟡 Medium Priority</option>
                    <option value="high">🔴 High Priority</option>
                </select>
                <div class="modal-btns">
                    <button id="modal-cancel" class="btn-cancel">Cancel</button>
                    <button id="modal-save" class="btn-save">Save Changes</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
